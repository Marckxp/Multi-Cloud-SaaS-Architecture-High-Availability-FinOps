name: vazamento

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fontes válidas
        run: node ferramentas/verificar-fontes.mjs
      - name: README em dia com as fontes
        run: node ferramentas/gerar-readme.mjs --verificar
      - name: Sem vazamento nos arquivos
        env:
          VITRINE_PROIBIDOS: ${{ secrets.VITRINE_PROIBIDOS }}
        run: node ferramentas/verificar-vazamento.mjs --exigir-lista
      - name: Sem vazamento no histórico do PR
        if: github.event_name == 'pull_request'
        env:
          VITRINE_PROIBIDOS: ${{ secrets.VITRINE_PROIBIDOS }}
        run: node ferramentas/verificar-vazamento.mjs --exigir-lista --intervalo "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: PR do Jules não mexe em fontes, ferramentas nem workflows
        # O PR do Jules sai em nome do dono do repositório; o que o identifica é o branch jules-<tarefa>.
        if: github.event_name == 'pull_request' && (startsWith(github.event.pull_request.head.ref, 'jules-') || contains(github.event.pull_request.user.login, 'jules'))
        run: |
          proibidos=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '^(fontes/|ferramentas/|\.github/|AGENTS\.md$)' || true)
          if [ -n "$proibidos" ]; then echo "Caminhos protegidos alterados:"; echo "$proibidos"; exit 1; fi
      - name: Pacote de fatos só mexe em fontes/ e README.md (R7)
        # Os PRs fatos/* entram com merge automático; qualquer outro caminho exige um PR humano.
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'fatos/')
        run: |
          fora=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -vE '^(fontes/|README\.md$)' || true)
          if [ -n "$fora" ]; then echo "R7: o pacote de fatos alterou caminhos fora de fontes/ e README.md:"; echo "$fora"; exit 1; fi
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
